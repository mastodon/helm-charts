apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fediscoverer.fullname" . }}-web
  labels:
    {{- include "fediscoverer.labels" . | nindent 4 }}
    joinmastodon.org/component: fediscoverer-web
    {{- with .Values.web.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ coalesce .Values.web.replicaCount .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fediscoverer.selectorLabels" . | nindent 6 }}
      joinmastodon.org/component: fediscoverer-web
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "fediscoverer.selectorLabels" . | nindent 8 }}
        joinmastodon.org/component: fediscoverer-web
        {{- with .Values.web.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-web
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- with .Values.web.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: DOMAIN
              value: {{ .Values.config.domain }}
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "fediscoverer.secrets.secretKeyBase" . }}
                  key: {{ .Values.config.existingSecretKeys.secretKeyBase }}
            - name: DATABASE_URL
              value: {{ include "fediscoverer.database.uri" . }}
            - name: FEDISCOVERER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.database.password.secretKeyRef.name }}
                  key: {{ .Values.config.database.password.secretKeyRef.key }}
            {{- if .Values.metrics.prometheus.enabled }}
            - name: PROMETHEUS_EXPORTER_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.config.jsonLogging }}
            - name: JSON_LOGGING
              value: "true"
            {{- end }}
            {{- if .Values.config.queueConnectionPoolSize }}
            - name: QUEUE_CONNECTION_POOL_SIZE
              value: {{ .Values.config.queueConnectionPoolSize | quote }}
            {{- end }}
            {{- if or .Values.web.otel.enabled (and .Values.otel.enabled (ne .Values.web.otel.enabled false)) }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ required "OTEL endpoint is required when OTEL is enabled" (coalesce .Values.web.otel.endpointUri .Values.otel.endpointUri) }}
            - name: OTEL_SERVICE_NAME_PREFIX
              value: {{ coalesce .Values.web.otel.namePrefix .Values.otel.namePrefix }}
            - name: OTEL_SERVICE_NAME_SEPARATOR
              value: "{{ coalesce .Values.web.otel.nameSeparator .Values.otel.nameSeparator }}"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /up
              port: http
          readinessProbe:
            httpGet:
              path: /up
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.metrics.prometheus.enabled }}
        - name: prometheus-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command:
            - ./bin/prometheus_exporter
          args:
            - "--bind"
            - "0.0.0.0"
            - "--port"
            - "{{ .Values.metrics.prometheus.port }}"
          resources:
            requests:
              cpu: "0.1"
              memory: "180M"
            limits:
              cpu: "0.5"
              memory: "250M"
          ports:
            - name: prometheus
              containerPort: {{ .Values.metrics.prometheus.port }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
