# Default values for fediscoverer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# General replica count for all pods
replicaCount: 1

image:
  repository: ghcr.io/mastodon/fediscoverer
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# App-wide configuration
config:

  # URL that the service is accessible from
  domain: localhost

  # Fediverse secret key base.
  secretKeyBase: ""

  # Existing secret that contains the secretKeyBase.
  # If set, takes precedence over the above value.
  existingSecret: ""
  existingSecretKeys:
    secretKeyBase: secret-key-base

  # Size of the DB connection pool used by the application.
  queueConnectionPoolSize: 5

  # PostgreSQL database connection information.
  # Some values for the database are hard-coded into the app, and must be:
  #   - Username: fediscoverer
  #   - Databases (all owned by fediscoverer):
  #     - fediscoverer_production
  #     - fediscoverer_production_cache
  #     - fediscoverer_production_queue
  database:
    host: localhost
    port: 5432
    password:
      secretKeyRef:
        name: postgresql-auth
        key: password

  # Whether to enable JSON logging
  jsonLogging: true

# Configuration for web pods
web:

  # Number of web pods
  # Will override the global replicaCount value
  replicaCount: 1

  # Tags for the deployment object
  tags: ""

  # Additional annotations for web pods
  # These will be added in addition to global podAnnotations
  podAnnotations: {}

  # Additional labels for web pods
  # These will be added in addition to other labels
  podlabels: {}

  # Additional environment variables to set for all web pods.
  # Applied in additional to global env values.
  env: {}

# Configuration for job pods
jobs:

  # Number of job pods
  # Will override the global replicaCount value
  replicaCount: 1

  # Tags for the deployment object
  tags: ""

  # Additional annotations for web pods
  # These will be added in addition to global podAnnotations
  podAnnotations: {}

  # Additional labels for jobs pods
  # These will be added in addition to other labels
  podlabels: {}

  # Additional environment variables to set for all job pods.
  # Applied in additional to global env values.
  env: {}

# Additional environment variables to set for all pods.
env: {}

# Whether to enable the prometheus exporter for monitoring
metrics:
  prometheus:
    enabled: false
    port: 9394

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: staging.fediscoverer.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

httproute:
  enabled: true

  labels: {}
  annotations: {}

  parentRefs:
    - name: example-gateway
      namespace: example-gateway-namespace
      sectionName: websecure
  hostnames:
    - example.domain
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
