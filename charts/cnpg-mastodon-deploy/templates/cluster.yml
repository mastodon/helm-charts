apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "cnpg.fullname" . }}
  labels:
    {{- include "cnpg.labels" . | nindent 4 }}
    {{- with .Values.cluster.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  instances: {{ .Values.instances }}
  imageName: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
  {{- if or (and .Values.cluster.superuser.username .Values.cluster.superuser.password) .Values.cluster.superuser.existingSecret }}
  enableSuperuserAccess: true
  superuserSecret:
    name: {{ include "cnpg.secrets.superuserName" . }}
  {{- end }}
  {{- if eq .Values.backup.method "plugin" }}
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: {{ include "cnpg.store.name" . }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.cluster.dbname }}
      owner: {{ .Values.cluster.owner }}
      secret:
        name: {{ include "cnpg.secrets.userName" . }}
      postInitSQL:
        - CREATE DATABASE {{ .Values.cluster.dbname }} OWNER {{ .Values.cluster.owner }}
  storage:
    size: {{ .Values.cluster.storage }}
  monitoring:
    enablePodMonitor: true
  affinity:
    {{- with .Values.affinity }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
