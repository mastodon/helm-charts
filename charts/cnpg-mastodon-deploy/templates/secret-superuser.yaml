{{- if not .Values.cluster.superuser.existingSecret }}
{{- if and .Values.cluster.superuser.username .Values.cluster.superuser.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cnpg.secrets.superuserName" . }}
  labels:
    {{- include "cnpg.labels" . | trim | nindent 4 }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: kubernetes.io/basic-auth
data:
  username: {{ .Values.cluster.superuser.username | b64enc }}
  password: {{ .Values.cluster.superuser.password | b64enc }}
{{- end }}
{{- end }}
