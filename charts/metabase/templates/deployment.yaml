apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metabase.fullname" . }}
  labels:
    {{- include "metabase.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "metabase.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "metabase.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "metabase.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- with .Values.metabase.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: MB_DB_TYPE
              value: {{ .Values.metabase.database.type }}
            - name: MB_DB_DBNAME
              value: {{ .Values.metabase.database.dbname }}
            - name: MB_DB_HOST
              value: {{ .Values.metabase.database.host }}
            - name: MB_DB_PORT
              value: {{ .Values.metabase.database.port | quote }}
            - name: MB_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "metabase.secrets.databaseName" . }}
                  key: {{ .Values.metabase.database.existingSecretKeys.username }}
            - name: MB_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "metabase.secrets.databaseName" . }}
                  key: {{ .Values.metabase.database.existingSecretKeys.password }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
