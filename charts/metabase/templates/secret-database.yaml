{{- if not .Values.metabase.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metabase.secrets.databaseName" . }}
  labels:
    {{- include "metabase.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
data:
  username: {{ required "Database username is required with no existing secret" .Values.metabase.database.username | b64enc }}
  password: {{ required "Database password is required with no existing secret" .Values.metabase.database.password | b64enc }}
{{- end }}
