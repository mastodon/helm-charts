{{- if not .Values.mastrics.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mastrics.secrets.postgresName" . }}
  labels:
    {{- include "mastrics.labels" . | trim | nindent 4 }}
type: kubernetes.io/basic-auth
data:
  username: {{ required "Database username is required with no existing secret" .Values.mastrics.database.username | b64enc }}
  password: {{ required "Database password is required with no existing secret" .Values.mastrics.database.password | b64enc }}
{{- end }}
