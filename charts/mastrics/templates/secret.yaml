{{- if not .Values.mastrics.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mastrics.secrets.secretKeyBase" . }}
  labels:
    {{- include "mastrics.labels" . | nindent 4 }}
type: Opaque
data:
  secret-key-base: {{ required "secretKeyBase is required with no existing secret" .Values.mastrics.secretKeyBase | b64enc }}
{{- end }}
