# Default values for mastrics.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Config for the Mastrics app.
mastrics:

  # Value for RAILS_ENV.
  railsEnv: production

  # Secret Key Base value.
  secretKeyBase: ""

  # Existing secret that contains the secretKeyBase.
  # If set, takes precedence over `secretKeyBase`.
  existingSecret: ""
  existingSecretKeys:
    secretKeyBase: secret-key-base

  # PostgreSQL database connection information.
  database:
    host: ""
    port: 5432
    dbname: mastrics_production

    username: ""
    password: ""

    # May also specify a secret for authentication.
    # If set, takes precedence over `username` and `password`.
    existingSecret: ""
    existingSecretKeys:
      username: username
      password: password

  # Additional environment variables to set.
  env: []

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

httproute:
  enabled: true

  labels: {}
  annotations: {}

  parentRefs:
    - name: example-gateway
      namespace: example-gateway-namespace
      sectionName: websecure
  hostnames:
    - example.domain
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
